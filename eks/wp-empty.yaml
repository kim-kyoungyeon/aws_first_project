apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordpress
      tier: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wordpress
        tier: frontend
    spec:
      containers:
        - image: wordpress:php8.1-apache
          name: wordpress
          env:
            - name: WORDPRESS_DB_HOST
              value: example-db.cluster-xxxxxxxxxxxx.ap-northeast-2.rds.amazonaws.com
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-db-secret  # kubectl create secret generic wordpress-db-secret --from-literal=password=<YOUR_PASSWORD>
                  key: password
            - name: WORDPRESS_DB_USER
              value: admin
            - name: WORDPRESS_DB_NAME
              value: wordpress
          ports:
            - containerPort: 80
              name: wordpress
          volumeMounts:
            - name: wordpress-persistent-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-persistent-storage
          emptyDir: {}
